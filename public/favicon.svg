<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#263147" stroke-width="1.5" />

  <!-- Node accents -->
  <circle cx="20" cy="18" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="44" cy="46" r="1.5" fill="#c084fc" opacity="0.8" />
  <circle cx="44" cy="18" r="1.5" fill="#818cf8" opacity="0.8" />
  <circle cx="20" cy="46" r="1.5" fill="#38bdf8" opacity="0.8" />

  <!-- Glowing N Nexus Path -->
  <path d="M 20 46 L 20 18 L 44 46 L 44 18"
        stroke="url(#nexusGrad)"
        stroke-width="5.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        filter="url(#glow)" />

  <!-- Center nexus neural pulse dot -->
  <circle cx="32" cy="32" r="2.5" fill="#f59e0b" />
</svg>
