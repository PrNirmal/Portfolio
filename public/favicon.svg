<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Near-Black Background Gradient (#0b0b0c) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f11" />
      <stop offset="100%" stop-color="#0b0b0c" />
    </linearGradient>

    <!-- Warm Burnt-Orange to Lighter Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8672e" />
      <stop offset="100%" stop-color="#f0904f" />
    </linearGradient>

    <!-- Soft Orange Glow -->
    <filter id="orangeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feColorMatrix type="matrix" values="
        1 0 0 0 0.91
        0 0.4 0 0 0.40
        0 0 0.2 0 0.18
        0 0 0 0.85 0" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Square Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />

  <!-- Bold Modern Geometric Letter "N" -->
  <path d="M 144 128 L 204 128 L 308 306 L 308 128 L 368 128 L 368 384 L 308 384 L 204 206 L 204 384 L 144 384 Z"
        fill="url(#orangeGrad)"
        filter="url(#orangeGlow)" />
</svg>
